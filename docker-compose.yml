# Personal Writing Workspace — Docker Compose
#
# Starts three services:
#   1. LanguageTool  — grammar checking engine
#   2. backend       — FastAPI (Python)
#   3. frontend      — React app served by nginx
#
# Usage:
#   docker compose up --build
#
# Then open: http://localhost:5173
# API docs: http://localhost:8000/docs

services:
  languagetool:
    image: erikvl87/languagetool:latest
    ports:
      - "8081:8081"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/writer.db
      - LANGUAGETOOL_URL=http://languagetool:8081
    volumes:
      - backend-data:/app/data
    depends_on:
      - languagetool
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
